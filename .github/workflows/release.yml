name: Build and Release CodeZone

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Executables
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: codezone-linux-x64
            artifact_name: codezone-linux
            archive_ext: tar.gz
          - os: macos-latest
            asset_name: codezone-macos-x64
            artifact_name: codezone-macos
            archive_ext: tar.gz
          - os: windows-latest
            asset_name: codezone-windows-x64
            artifact_name: codezone-windows
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller customtkinter Pillow

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all customtkinter --name "${{ matrix.asset_name }}" main.py

      - name: Compress Build Output (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Compress Build Output (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist/${{ matrix.asset_name }}" -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: codezone-*.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Organize assets
        run: |
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ./release-assets/ \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
